  <script>
    // Audio Context sintético nativo
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playFlipSound() {
      if (!soundEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundText').innerText = soundEnabled ? "Sonido Habilitado" : "Sonido Silenciado";
      document.getElementById('soundIcon').classList.toggle('text-blue-400', soundEnabled);
      document.getElementById('soundIcon').classList.toggle('text-slate-500', !soundEnabled);
    }

    // PWA Install Prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installAppBtn').classList.remove('hidden');
    });

    function installPWAApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          document.getElementById('installAppBtn').classList.add('hidden');
        });
      }
    }

    // Construcción de la BD de 100 Wesen
    const wesen100Database = wesenNames.map(item => ({
      id: item[0],
      name: item[1],
      subtitle: item[2],
      type: item[3],
      danger: item[4],
      color: item[5],
      description: item[6],
      seasons: "Temporadas: 1 – 6",
      powers: [
        { title: "Atributos de Especie", desc: "Potenciación física y sensorial según su linaje animal." },
        { title: "Transformación Woge", desc: "Revelación de su verdadera naturaleza ante un Grimm." }
      ],
      weaknesses: [
        { title: "Combate Táctico Grimm", desc: "Sensibles a las armas especializadas del vagón de Nick." },
        { title: "Toxinas Específicas", desc: "Vulnerables a extractos botánicos de la Tienda de Especias." }
      ],
      seriesNotes: "Aparece registrado en los diarios de campo de la Familia Grimm.",
      humanName: "Forma Humana Adaptada",
      humanColor: item[5],
      grimmNotes: "Consignado en las crónicas de la casa de los Grimm en Portland.",
      quote: `«La verdadera esencia de un ${item[1]} no se oculta del ojo del Grimm.»`
    }));

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('totalBadge').innerText = wesen100Database.length;
      renderCards(wesen100Database);
      lucide.createIcons();
    });

    function renderCards(data) {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      if (data.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 font-mono text-xs">No se encontraron los Wesen solicitados.</div>`;
        return;
      }

      data.forEach(wesen => {
        let orbsHTML = '';
        for (let i = 1; i <= 5; i++) {
          orbsHTML += `<div class="danger-orb ${i <= wesen.danger ? 'active' : ''}"></div>`;
        }

        const card = document.createElement('div');
        card.className = "grimm-card-bg border border-grimm-border hover:border-blue-500 rounded-xl p-3 shadow-lg cursor-pointer transition-all hover:-translate-y-1 flex flex-col justify-between";
        card.onclick = () => openModal(wesen.id);

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between border-b border-grimm-border pb-1.5 mb-2">
              <span class="bg-blue-950 border border-blue-800 text-blue-300 font-mono text-[9px] font-bold px-1.5 py-0.5 rounded">
                N.º ${wesen.id}
              </span>
              <span class="font-serif font-bold text-slate-400 text-[10px] tracking-widest">GRIMM</span>
            </div>

            <div class="text-center mb-1.5">
              <h3 class="text-base font-extrabold font-serif title-metallic uppercase leading-tight">${wesen.name}</h3>
              <div class="text-[10px] text-slate-400 italic">${wesen.subtitle}</div>
            </div>

            <!-- Ilustración SVG HD -->
            <div class="w-full h-32 bg-slate-950 border border-blue-900/60 rounded flex items-center justify-center p-2 mb-2 shadow-inner">
              ${getWesenIllustration(wesen.id, wesen.type, wesen.name, wesen.color)}
            </div>

            <div class="flex items-center justify-between text-[10px] mb-2 bg-slate-900/80 p-1.5 rounded">
              <span class="text-slate-400 font-mono text-[9px]">Tipo: <strong class="text-white">${wesen.type}</strong></span>
              <div class="flex items-center gap-1">
                ${orbsHTML}
              </div>
            </div>

            <p class="text-[10px] text-slate-300 line-clamp-2 leading-relaxed mb-2">
              ${wesen.description}
            </p>
          </div>

          <div class="border-t border-slate-800 pt-1.5 flex items-center justify-between text-[9px] font-mono text-blue-400">
            <span>VER FICHA COMPLETA</span>
            <i data-lucide="chevron-right" class="w-3 h-3"></i>
          </div>
        `;
        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    function openModal(id) {
      playFlipSound();
      const w = wesen100Database.find(item => item.id === id);
      if (!w) return;

      let orbsHTML = '';
      for (let i = 1; i <= 5; i++) {
        orbsHTML += `<div class="danger-orb ${i <= w.danger ? 'active' : ''}"></div>`;
      }

      const modalContent = document.getElementById('modalContent');
      modalContent.innerHTML = `
        <div class="flex items-center justify-between border-b-2 border-grimm-border pb-2 mb-3">
          <div class="bg-blue-950 border border-blue-400/50 rounded px-2 py-0.5 text-xs font-mono font-bold text-blue-300">
            WESEN N.º ${w.id}
          </div>
          <div class="text-center">
            <h2 class="text-2xl font-extrabold font-serif title-metallic uppercase leading-none">${w.name}</h2>
            <div class="text-xs text-slate-400 italic">${w.subtitle}</div>
          </div>
          <div class="font-serif font-bold text-lg text-slate-300 tracking-widest">GRIMM</div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 mb-3">
          <div class="sm:col-span-7 bg-slate-950 border border-blue-900/60 rounded-lg h-48 flex items-center justify-center p-2">
            ${getWesenIllustration(w.id, w.type, w.name, w.color)}
          </div>

          <div class="sm:col-span-5 flex flex-col gap-2">
            <div class="grimm-panel p-2">
              <span class="block text-[9px] font-mono uppercase text-blue-400 font-bold">CLASIFICACIÓN</span>
              <span class="text-xs font-bold text-white">${w.type}</span>
            </div>
            <div class="grimm-panel p-2">
              <span class="block text-[9px] font-mono uppercase text-blue-400 font-bold mb-1">PELIGROSIDAD</span>
              <div class="flex items-center gap-1">${orbsHTML}</div>
            </div>
            <div class="grimm-panel p-2 flex-1">
              <span class="block text-[9px] font-mono uppercase text-blue-400 font-bold mb-1">DESCRIPCIÓN</span>
              <p class="text-[10px] leading-relaxed text-slate-300">${w.description}</p>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">
          <div class="grimm-panel p-2.5">
            <div class="text-[10px] font-bold text-blue-300 uppercase font-mono mb-1">PODERES</div>
            ${w.powers.map(p => `<div class="text-[10px]">• <strong>${p.title}:</strong> ${p.desc}</div>`).join('')}
          </div>
          <div class="grimm-panel p-2.5">
            <div class="text-[10px] font-bold text-red-300 uppercase font-mono mb-1">DEBILIDADES</div>
            ${w.weaknesses.map(wk => `<div class="text-[10px]">• <strong>${wk.title}:</strong> ${wk.desc}</div>`).join('')}
          </div>
        </div>

        <div class="border-t border-slate-800 pt-2 flex items-center justify-between text-[10px] italic text-slate-400">
          <span>${w.quote}</span>
          <span class="font-sans not-italic text-blue-400 font-bold font-mono">🐾 GRIMM</span>
        </div>
      `;

      document.getElementById('cardModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('cardModal').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'cardModal') closeModal();
    }

    function filterCards() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      const typeVal = document.getElementById('typeFilter').value;
      const dangerVal = document.getElementById('dangerFilter').value;

      const filtered = wesen100Database.filter(w => {
        const matchesSearch = w.name.toLowerCase().includes(searchVal) || w.subtitle.toLowerCase().includes(searchVal);
        const matchesType = (typeVal === 'ALL') || (w.type === typeVal);
        const matchesDanger = (dangerVal === 'ALL') || (w.danger.toString() === dangerVal);

        return matchesSearch && matchesType && matchesDanger;
      });

      renderCards(filtered);
    }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.warn("No se pudo registrar el modo sin conexión:", err);
        });
      });
    }
  </script>
